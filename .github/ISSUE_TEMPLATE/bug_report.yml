name: Bug report
description: Report a reproducible problem in an application or shared component.
body:
  - type: markdown
    attributes:
      value: |
        Use [private vulnerability reporting](https://github.com/kryptocorelabs/vault-source/blob/main/SECURITY.md) for security vulnerabilities.
        Use synthetic data in examples. Remove keys, passwords, and personal data.
  - type: input
    id: environment
    attributes:
      label: Revision and environment
      description: Include the commit or version, operating system, and Rust or Python version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Share the smallest example or commands that trigger the problem.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
