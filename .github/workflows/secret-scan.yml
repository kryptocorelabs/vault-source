name: Source secret scan
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify Gitleaks 8.30.1
        env:
          SCANNER_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          directory="$RUNNER_TEMP/source-secret-scan"
          mkdir "$directory"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$directory/scanner.tar.gz"
          printf '%s  %s\n' "$SCANNER_SHA256" "$directory/scanner.tar.gz" | sha256sum --check
          tar -xzf "$directory/scanner.tar.gz" -C "$directory"
          echo "$directory" >> "$GITHUB_PATH"
      - name: Scan complete Git history with redacted findings
        run: gitleaks git . --log-opts=--all --redact --no-banner
