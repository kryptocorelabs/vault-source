name: Vault CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  vault-tests:
    name: Vault container and channel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo +1.99.1 test --locked --release -p kryptocore-vault -p kryptocore-vault-format -p vault-firefox-channel -- --test-threads=1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python apps/vault/tests/epoch-cache.py
      - name: Check out the reviewed independent Rescue reader
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kryptocorelabs/apps-source
          ref: 65f28e4cfd35020616d62bcf764b2025c10c49ab
          path: rescue-peer
          persist-credentials: false
      - run: cargo +1.99.1 build --locked --release -p kryptocore-vault
      - run: cargo +1.99.1 build --locked --release --manifest-path rescue-peer/Cargo.toml -p kryptocore-rescue
      - name: Vault to Rescue real-worker interoperability
        run: python apps/vault/tests/vault-rescue-interop.py --vault target/release/kryptocore-vault --rescue rescue-peer/target/release/kryptocore-rescue

  browser-sessions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test apps/vault/tests/firefox-security.test.cjs
      - run: python3 -m unittest discover -s apps/vault/tests -p test_mozilla_amo.py

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out the reviewed Core source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kryptocorelabs/kryptocore
          ref: ff58bfcb5c752abfdc531a4fd25dad25d7e49429
          path: core-upstream
          persist-credentials: false
      - name: Check the vendored Core source tree
        shell: bash
        run: |
          vendored=$(git rev-parse --verify HEAD:rust)
          upstream=$(git -C core-upstream rev-parse --verify HEAD:rust)
          if [[ "$vendored" != "$upstream" ]]; then
            echo '::error::The vendored rust/ tree differs from the reviewed Core revision. See apps/vault/CI.md.'
            exit 1
          fi
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo +1.99.1 install --locked cargo-audit --version 0.22.2
      - run: cargo +1.99.1 audit --deny warnings
      - run: cargo +1.99.1 install --locked cargo-deny --version 0.19.9
      - run: cargo +1.99.1 deny --locked check --config deny.toml licenses
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --disable-pip --no-deps -r apps/vault/desktop/requirements.txt

  firefox-package:
    name: Firefox package (${{ matrix.build }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        build: [first, second]
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
      - shell: pwsh
        run: ./apps/vault/package-firefox.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP firefox-package)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: firefox-package-${{ matrix.build }}
          path: ${{ runner.temp }}/firefox-package/vault-firefox-amo-*.zip
          if-no-files-found: error

  build-consistency:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: [vault-tests, browser-sessions, dependencies, firefox-package]
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: firefox-package-*
          path: ${{ runner.temp }}/firefox-packages
      - shell: pwsh
        run: |
          $packages = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'firefox-packages') -Recurse -File -Filter '*.zip'
          ./apps/vault/tests/verify-build.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP vault-build-check) -Packages $packages.FullName
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Test Vault desktop recovery and dialog workflow
        shell: pwsh
        run: |
          python -m pip install -r apps/vault/desktop/requirements.txt
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'vault-build-check/desktop-target'
          python apps/vault/tests/desktop-workflow.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vault-build-checksums
          path: ${{ runner.temp }}/vault-build-check/SHA256SUMS.txt
          if-no-files-found: error

  attest-firefox-package:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: firefox-package-first
          path: firefox-package
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: firefox-package/vault-firefox-amo-*.zip
