[package]
name = "kryptocore-vault"
version = "0.1.0-rc.2"
edition = "2021"
rust-version = "1.89"
publish = false
license = "MIT"
default-run = "kryptocore-vault"

[dependencies]
kryptocore.workspace = true
kryptocore-vault-format = { path = "../../modules/vault-format" }
getrandom = "0.3"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tiny_http = "0.12"
url = "2"
zeroize = { version = "1", features = ["serde"] }
