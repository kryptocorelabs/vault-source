[package]
name = "vault-firefox-channel"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
snow = { version = "=0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-curve25519", "use-getrandom", "use-sha2"] }
zeroize = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = "0.3"
