[package]
name = "kryptocore-vault-format"
version = "0.1.0-rc.2"
edition = "2021"
license = "MIT"
publish = false
description = "Shared Vault format implementation for Vault and Rescue"

[dependencies]
kryptocore.workspace = true
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zeroize = "1"
